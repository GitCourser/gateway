name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 三平台二进制 ----------
  build:
    strategy:
      matrix:
        include:
          # Windows x64（原生 MSVC）
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: gateway.exe
          # Linux x64（静态 musl）
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            exe: gateway
            docker_arch: amd64
          # Linux arm64（静态 musl，原生 ARM runner）
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            exe: gateway
            docker_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          artifact="gateway-${VERSION}-${{ matrix.target }}"
          case "${{ matrix.exe }}" in
            *.exe) artifact="${artifact}.exe" ;;
          esac
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/${artifact}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

      - name: Upload Linux binary for Docker
        if: matrix.docker_arch
        uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ matrix.docker_arch }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}

  # ---------- Alpine 多架构镜像 -> GHCR ----------
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare image context
        id: meta
        run: |
          mkdir -p binaries/amd64 binaries/arm64
          cp artifacts/gateway-amd64/gateway binaries/amd64/gateway
          cp artifacts/gateway-arm64/gateway binaries/arm64/gateway
          chmod +x binaries/amd64/gateway binaries/arm64/gateway

          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          fi
          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "minor=$(echo "${VERSION}" | cut -d. -f1,2)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.minor }}
            ${{ steps.meta.outputs.image }}:latest
          provenance: false
